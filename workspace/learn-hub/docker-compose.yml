version: '3.8'

services:
  learn-hub:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=your-secret-key-change-in-production
    restart: unless-stopped

  # 可选：使用nginx反向代理
